<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Dinâmico Jurídico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 20px;
            color: #0b4da1;
        }

        h2 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 15px;
            padding-left: 10px;
        }

        .id-container {
            margin-bottom: 25px;
            padding-left: 10px;
        }
        .id-container label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .id-container input {
            width: 90%;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #0b4da1;
            border-radius: 6px;
            color: #0b4da1;
        }

        .checklist-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            font-size: 22px;
            user-select: none;
        }

        .checkmark {
            height: 28px;
            width: 28px;
            min-width: 28px;
            border: 2px solid #e95a8f;
            border-radius: 6px;
            margin-right: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .text {
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.3;
        }

        /* ESTADO: TEM DIREITO — checkbox verde com check */
        .checklist-item.tem-direito .checkmark {
            background-color: #28a745;
            border-color: #28a745;
        }
        .checklist-item.tem-direito .checkmark::after {
            content: "";
            position: absolute;
            display: block;
            left: 9px;
            top: 4px;
            width: 6px;
            height: 13px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        /* ESTADO: NÃO TEM DIREITO — checkbox vermelho com X, texto riscado */
        .checklist-item.nao-tem-direito .checkmark {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        .checklist-item.nao-tem-direito .checkmark::after {
            content: "✕";
            position: absolute;
            color: white;
            font-size: 15px;
            font-weight: bold;
            line-height: 1;
        }
        .checklist-item.nao-tem-direito .text {
            text-decoration: line-through;
            color: #721c24;
            opacity: 0.5;
        }

        .btn-limpar {
            margin-top: 30px;
            background-color: #e95a8f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 94%;
            transition: background 0.2s;
        }
        .btn-limpar:hover {
            background-color: #c84373;
        }
    </style>
</head>
<body>

    <h2>Checklist</h2>

    <div class="id-container">
        <label for="cliente-id">Identificador do Cliente (Nome ou Chamado):</label>
        <input type="text" id="cliente-id" placeholder="Digite para carregar/salvar..." value="Geral">
    </div>

    <div class="checklist-container">
        <div class="checklist-item" id="item-aposentadoria">
            <span class="checkmark"></span>
            <span class="text">Aposentadoria</span>
        </div>
        <div class="checklist-item" id="item-aposentadoria-pcd">
            <span class="checkmark"></span>
            <span class="text">Aposentadoria PCD</span>
        </div>
        <div class="checklist-item" id="item-aposentadoria-especial">
            <span class="checkmark"></span>
            <span class="text">Aposentadoria Especial</span>
        </div>
        <div class="checklist-item" id="item-auxilio">
            <span class="checkmark"></span>
            <span class="text">Auxílio Acidente</span>
        </div>
        <div class="checklist-item" id="item-piso">
            <span class="checkmark"></span>
            <span class="text">Piso</span>
        </div>
        <div class="checklist-item" id="item-hora">
            <span class="checkmark"></span>
            <span class="text">Hora Atividade</span>
        </div>
        <div class="checklist-item" id="item-recreio">
            <span class="checkmark"></span>
            <span class="text">Recreio</span>
        </div>
        <div class="checklist-item" id="item-fgts">
            <span class="checkmark"></span>
            <span class="text">FGTS</span>
        </div>
        <div class="checklist-item" id="item-indenizacao">
            <span class="checkmark"></span>
            <span class="text">Indenização</span>
        </div>
        <div class="checklist-item" id="item-isencao">
            <span class="checkmark"></span>
            <span class="text">Isenção</span>
        </div>
    </div>

    <button class="btn-limpar" onclick="limparChecklist()">Limpar Este Checklist</button>

    <script>
        const inputCliente = document.getElementById('cliente-id');
        const items = document.querySelectorAll('.checklist-item');

        // ─── Captura chatId da URL (Digisac) ───────────────────────────
        function obterChatId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('chatId') || 'Geral';
        }

        // ─── Vincula eventos via JS (evita conflito de propagação) ─────
        items.forEach(item => {
            const checkmark = item.querySelector('.checkmark');
            const text      = item.querySelector('.text');

            // Clique no QUADRADO → TEM DIREITO (verde)
            checkmark.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = item.id;
                if (item.classList.contains('tem-direito')) {
                    item.classList.remove('tem-direito');
                    salvarEstado(id, 'neutro');
                } else {
                    item.classList.remove('nao-tem-direito');
                    item.classList.add('tem-direito');
                    salvarEstado(id, 'direito');
                }
            });

            // Clique no TEXTO → NÃO TEM DIREITO (vermelho + riscado)
            text.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = item.id;
                if (item.classList.contains('nao-tem-direito')) {
                    item.classList.remove('nao-tem-direito');
                    salvarEstado(id, 'neutro');
                } else {
                    item.classList.remove('tem-direito');
                    item.classList.add('nao-tem-direito');
                    salvarEstado(id, 'vetado');
                }
            });
        });

        // ─── LocalStorage ───────────────────────────────────────────────
        function salvarEstado(idItem, status) {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            const storageKey = `${clienteAtual}-${idItem}`;
            if (status === 'neutro') {
                localStorage.removeItem(storageKey);
            } else {
                localStorage.setItem(storageKey, status);
            }
        }

        function carregarChecklist() {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            items.forEach(item => {
                const storageKey = `${clienteAtual}-${item.id}`;
                const statusSalvo = localStorage.getItem(storageKey);
                item.classList.remove('tem-direito', 'nao-tem-direito');
                if (statusSalvo === 'direito') {
                    item.classList.add('tem-direito');
                } else if (statusSalvo === 'vetado') {
                    item.classList.add('nao-tem-direito');
                }
            });
        }

        function limparChecklist() {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            items.forEach(item => {
                const storageKey = `${clienteAtual}-${item.id}`;
                item.classList.remove('tem-direito', 'nao-tem-direito');
                localStorage.removeItem(storageKey);
            });
        }

        inputCliente.addEventListener('input', carregarChecklist);

        // ─── Inicialização ──────────────────────────────────────────────
        inputCliente.value = obterChatId();
        carregarChecklist();
    </script>

</body>
</html>
