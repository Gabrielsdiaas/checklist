<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Dinâmico Jurídico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 20px;
            color: #0b4da1; /* Azul escuro do título e textos padrão */
        }

        h2 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 15px;
            padding-left: 10px;
        }

        /* Campo para identificar o cliente atual */
        .id-container {
            margin-bottom: 25px;
            padding-left: 10px;
        }
        .id-container label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .id-container input {
            width: 90%;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #0b4da1;
            border-radius: 6px;
            color: #0b4da1;
        }

        .checklist-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            font-size: 22px;
            user-select: none;
        }

        /* O Quadrado do Checkbox (Borda rosa original) */
        .checkmark {
            height: 24px;
            width: 24px;
            border: 2px solid #e95a8f; 
            border-radius: 6px;
            margin-right: 15px;
            display: inline-block;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        /* O Texto do Nome (Clicável para "Não Tem Direito") */
        .text {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* =======================================================
           ESTADO: TEM DIREITO (Verde, texto normal) 
           ======================================================= */
        .checklist-item.tem-direito .checkmark {
            background-color: #28a745; /* Verde */
            border-color: #28a745;
        }
        /* Símbolo de "Visto" branco dentro do quadrado verde */
        .checklist-item.tem-direito .checkmark:after {
            content: "";
            position: absolute;
            display: block;
            left: 8px;
            top: 3px;
            width: 5px;
            height: 12px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        /* =======================================================
           ESTADO: NÃO TEM DIREITO (Vermelho, texto riscado) 
           ======================================================= */
        .checklist-item.nao-tem-direito .checkmark {
            background-color: #dc3545; /* Vermelho */
            border-color: #dc3545;
        }
        /* Símbolo de "X" branco dentro do quadrado vermelho */
        .checklist-item.nao-tem-direito .checkmark:after {
            content: "✕";
            position: absolute;
            display: block;
            color: white;
            font-size: 16px;
            font-weight: bold;
            left: 5px;
            top: -1px;
        }
        /* Riscar o texto e deixar mais claro */
        .checklist-item.nao-tem-direito .text {
            text-decoration: line-through;
            color: #721c24;
            opacity: 0.5;
        }

        /* Botão para limpar o checklist */
        .btn-limpar {
            margin-top: 30px;
            background-color: #e95a8f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 94%;
            transition: background 0.2s;
        }
        .btn-limpar:hover {
            background-color: #c84373;
        }
    </style>
</head>
<body>

    <h2>Checklist</h2>

    <div class="id-container">
        <label for="cliente-id">Identificador do Cliente (Nome ou Chamado):</label>
        <input type="text" id="cliente-id" placeholder="Digite para carregar/salvar..." value="Geral">
    </div>

    <div class="checklist-container">
        <div class="checklist-item" id="item-aposentadoria">
            <span class="checkmark" onclick="alternarDireito('item-aposentadoria')"></span>
            <span class="text" onclick="alternarNaoDireito('item-aposentadoria')">Aposentadoria</span>
        </div>

        <div class="checklist-item" id="item-aposentadoria-pcd">
            <span class="checkmark" onclick="alternarDireito('item-aposentadoria-pcd')"></span>
            <span class="text" onclick="alternarNaoDireito('item-aposentadoria-pcd')">Aposentadoria PCD</span>
        </div>

        <div class="checklist-item" id="item-aposentadoria-especial">
            <span class="checkmark" onclick="alternarDireito('item-aposentadoria-especial')"></span>
            <span class="text" onclick="alternarNaoDireito('item-aposentadoria-especial')">Aposentadoria Especial</span>
        </div>
      
        <div class="checklist-item" id="item-auxilio">
            <span class="checkmark" onclick="alternarDireito('item-auxilio')"></span>
            <span class="text" onclick="alternarNaoDireito('item-auxilio')">Auxílio Acidente</span>
        </div>

        <div class="checklist-item" id="item-piso">
            <span class="checkmark" onclick="alternarDireito('item-piso')"></span>
            <span class="text" onclick="alternarNaoDireito('item-piso')">Piso</span>
        </div>

        <div class="checklist-item" id="item-hora">
            <span class="checkmark" onclick="alternarDireito('item-hora')"></span>
            <span class="text" onclick="alternarNaoDireito('item-hora')">Hora Atividade</span>
        </div>

        <div class="checklist-item" id="item-recreio">
            <span class="checkmark" onclick="alternarDireito('item-recreio')"></span>
            <span class="text" onclick="alternarNaoDireito('item-recreio')">Recreio</span>
        </div>

        <div class="checklist-item" id="item-fgts">
            <span class="checkmark" onclick="alternarDireito('item-fgts')"></span>
            <span class="text" onclick="alternarNaoDireito('item-fgts')">FGTS</span>
        </div>

        <div class="checklist-item" id="item-indenizacao">
            <span class="checkmark" onclick="alternarDireito('item-indenizacao')"></span>
            <span class="text" onclick="alternarNaoDireito('item-indenizacao')">Indenização</span>
        </div>

        <div class="checklist-item" id="item-isencao">
            <span class="checkmark" onclick="alternarDireito('item-isencao')"></span>
            <span class="text" onclick="alternarNaoDireito('item-isencao')">Isenção</span>
        </div>
    </div>

    <button class="btn-limpar" onclick="limparChecklist()">Limpar Este Checklist</button>

    <script>
        const inputCliente = document.getElementById('cliente-id');
        const items = document.querySelectorAll('.checklist-item');

        // Pega parâmetros da URL do Digisac
        const urlParams = new URLSearchParams(window.location.search);
        const urlChatId = urlParams.get('chatId');
        if (urlChatId) {
            inputCliente.value = urlChatId;
        }

        // Função executada ao clicar no QUADRADO (Tem Direito)
        // Se clicar de novo, volta para o estado inicial (limpo)
        function alternarDireito(idItem) {
            const el = document.getElementById(idItem);
            if (el.classList.contains('tem-direito')) {
                el.classList.remove('tem-direito');
                salvarEstado(idItem, 'neutro');
            } else {
                el.classList.remove('nao-tem-direito');
                el.classList.add('tem-direito');
                salvarEstado(idItem, 'direito');
            }
        }

        // Função executada ao clicar no TEXTO/NOME (Não Tem Direito)
        // Se clicar de novo, volta para o estado inicial (limpo)
        function alternarNaoDireito(idItem) {
            const el = document.getElementById(idItem);
            if (el.classList.contains('nao-tem-direito')) {
                el.classList.remove('nao-tem-direito');
                salvarEstado(idItem, 'neutro');
            } else {
                el.classList.remove('tem-direito');
                el.classList.add('nao-tem-direito');
                salvarEstado(idItem, 'vetado');
            }
        }

        // Salva a decisão na memória do navegador vinculada ao cliente atual
        function salvarEstado(idItem, status) {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            const storageKey = `${clienteAtual}-${idItem}`;
            if (status === 'neutro') {
                localStorage.removeItem(storageKey);
            } else {
                localStorage.setItem(storageKey, status);
            }
        }

        // Carrega as marcações corretas com base no nome do cliente atual
        function carregarChecklist() {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            items.forEach(item => {
                const storageKey = `${clienteAtual}-${item.id}`;
                const statusSalvo = localStorage.getItem(storageKey);

                item.classList.remove('tem-direito', 'nao-tem-direito');
                if (statusSalvo === 'direito') {
                    item.classList.add('tem-direito');
                } else if (statusSalvo === 'vetado') {
                    item.classList.add('nao-tem-direito');
                }
            });
        }

        // Monitora se o atendente alterar manualmente o identificador do cliente
        inputCliente.addEventListener('input', carregarChecklist);

        // Limpa todas as seleções do cliente atual
        function limparChecklist() {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            items.forEach(item => {
                const storageKey = `${clienteAtual}-${item.id}`;
                item.classList.remove('tem-direito', 'nao-tem-direito');
                localStorage.removeItem(storageKey);
            });
        }

        // Inicia carregando as informações ao abrir a aba
        carregarChecklist();
    </script>

</body>
</html>
