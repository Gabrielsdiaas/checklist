<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Dinâmico</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 20px;
            color: #0b4da1;
        }

        h2 {
            font-size: 32px;
            font-weight: normal;
            margin-bottom: 15px;
            padding-left: 10px;
        }

        /* Campo para identificar o cliente atual */
        .id-container {
            margin-bottom: 25px;
            padding-left: 10px;
        }
        .id-container label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .id-container input {
            width: 90%;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #0b4da1;
            border-radius: 6px;
            color: #0b4da1;
        }

        .checklist-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 22px;
            user-select: none;
        }

        .checklist-item input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 24px;
            width: 24px;
            border: 2px solid #e95a8f;
            border-radius: 6px;
            margin-right: 15px;
            display: inline-block;
            position: relative;
            transition: all 0.2s ease;
        }

        .checklist-item input:checked ~ .checkmark {
            background-color: #e95a8f;
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 8px;
            top: 3px;
            width: 5px;
            height: 12px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        .checklist-item input:checked ~ .checkmark:after {
            display: block;
        }

        .checklist-item input:checked ~ .text {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Botão para limpar o checklist */
        .btn-limpar {
            margin-top: 30px;
            background-color: #e95a8f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 94%;
            transition: background 0.2s;
        }
        .btn-limpar:hover {
            background-color: #c84373;
        }
    </style>
</head>
<body>

    <h2>Checklist</h2>

    <!-- Campo identificador para o atendente mudar de cliente sem misturar dados -->
    <div class="id-container">
        <label for="cliente-id">Identificador do Cliente (Nome ou Chamado):</label>
        <input type="text" id="cliente-id" placeholder="Digite para carregar/salvar..." value="Geral">
    </div>

    <div class="checklist-container">
        <label class="checklist-item">
            <input type="checkbox" id="item-aposentadoria">
            <span class="checkmark"></span>
            <span class="text">Aposentadoria</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-aposentadoria-pcd">
            <span class="checkmark"></span>
            <span class="text">Aposentadoria PCD</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-aposentadoria-especial">
            <span class="checkmark"></span>
            <span class="text">Aposentadoria Especial</span>
        </label>
      
        <label class="checklist-item">
            <input type="checkbox" id="item-auxilio">
            <span class="checkmark"></span>
            <span class="text">Auxílio Acidente</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-piso">
            <span class="checkmark"></span>
            <span class="text">Piso</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-hora">
            <span class="checkmark"></span>
            <span class="text">Hora Atividade</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-recreio">
            <span class="checkmark"></span>
            <span class="text">Recreio</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-fgts">
            <span class="checkmark"></span>
            <span class="text">FGTS</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-indenizacao">
            <span class="checkmark"></span>
            <span class="text">Indenização</span>
        </label>

        <label class="checklist-item">
            <input type="checkbox" id="item-isencao">
            <span class="checkmark"></span>
            <span class="text">Isenção</span>
        </label>
    </div>

    <button class="btn-limpar" onclick="limparChecklist()">Limpar Este Checklist</button>

    <script>
        const inputCliente = document.getElementById('cliente-id');
        const checkboxes = document.querySelectorAll('.checklist-item input');

        // Tenta pegar o ticketId da URL se o Digisac enviar no primeiro carregamento
        const urlParams = new URLSearchParams(window.location.search);
        const urlChatId = urlParams.get('chatId');
        if (urlChatId) {
            inputCliente.value = urlChatId;
        }

        // Função principal para carregar os dados baseados no cliente digitado
        function carregarChecklist() {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            checkboxes.forEach(checkbox => {
                const storageKey = `${clienteAtual}-${checkbox.id}`;
                checkbox.checked = localStorage.getItem(storageKey) === 'true';
            });
        }

        // Salva os dados sempre que clicar em uma caixinha
        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                const clienteAtual = inputCliente.value.trim() || 'Geral';
                const storageKey = `${clienteAtual}-${checkbox.id}`;
                localStorage.setItem(storageKey, checkbox.checked);
            });
        });

        // Recarrega a lista se o atendente mudar o nome do cliente no campo
        inputCliente.addEventListener('input', carregarChecklist);

        // Função do botão limpar
        function limparChecklist() {
            const clienteAtual = inputCliente.value.trim() || 'Geral';
            checkboxes.forEach(checkbox => {
                const storageKey = `${clienteAtual}-${checkbox.id}`;
                checkbox.checked = false;
                localStorage.removeItem(storageKey);
            });
        }

        // Inicializa o carregamento na abertura da página
        carregarChecklist();
    </script>

</body>
</html>
